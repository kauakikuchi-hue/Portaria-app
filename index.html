<style>
/* Layout: uma tela de portaria — busca grande no topo, resultado ou "quem está na escola" logo abaixo; abas só para relatório e ajustes */
:root{
  --bg:#FAFAF9; --surface:#FFFFFF; --sunk:#F5F5F4; --fg:#1C1917; --muted:#57534E; --line:#E7E5E4;
  --brand:#F86000; --on-brand:#1C1917; --brand-text:#C2410C;
  --ok:#15803D; --ok-soft:#E8F5EC; --warn:#A16207; --warn-soft:#FBF3DC; --danger:#B91C1C; --danger-soft:#FBE7E7;
  --scrim:rgba(28,25,23,.45);
  --key:#292524; --key-soft:#F5F5F4; --on-key:#FFFFFF;
  --ag:#F86000; --ag-soft:#FFF1E8; --on-ag:#1C1917;
  --brand-soft:#FFF1E8;
  --f-display:Roboto,"Segoe UI",Arial,sans-serif; --f-body:Roboto,"Segoe UI",Arial,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0C0A09; --surface:#1C1917; --sunk:#292524; --fg:#FAFAF9; --muted:#A8A29E; --line:#3A3430; --brand-text:#FB923C;
  --ok:#4ADE80; --ok-soft:#14321F; --warn:#FCD34D; --warn-soft:#3A2F12; --danger:#F87171; --danger-soft:#3D1717;
  --scrim:rgba(0,0,0,.6); --brand-soft:color-mix(in srgb,var(--brand) 22%,var(--surface)); --key:#E7E5E4; --key-soft:#292524; --on-key:#1C1917; --ag:#F86000; --ag-soft:#3A1E0C; --on-ag:#1C1917; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0C0A09; --surface:#1C1917; --sunk:#292524; --fg:#FAFAF9; --muted:#A8A29E; --line:#3A3430; --brand-text:#FB923C;
  --ok:#4ADE80; --ok-soft:#14321F; --warn:#FCD34D; --warn-soft:#3A2F12; --danger:#F87171; --danger-soft:#3D1717;
  --scrim:rgba(0,0,0,.6); --brand-soft:color-mix(in srgb,var(--brand) 22%,var(--surface)); --key:#E7E5E4; --key-soft:#292524; --on-key:#1C1917; --ag:#F86000; --ag-soft:#3A1E0C; --on-ag:#1C1917; color-scheme:dark}

*{box-sizing:border-box}
html,body{overflow-x:clip;max-width:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-text-size-adjust:100%}
main.wrap,#area,.dest,form.cad,.quick,.day,section{min-width:0}
main.wrap,#area,.dest,form.cad,.quick,.day,.cfg{grid-template-columns:minmax(0,1fr)}
.brand{flex:1 1 auto}
.perfil select{font-size:16px}
.plantao{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 16px;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
.plantao.venc{border-color:var(--warn);background:var(--warn-soft)}
.pl-txt{display:grid;min-width:0;gap:1px}
.pl-txt strong{font-size:.95rem}
.pl-txt span{color:var(--muted);font-size:.82rem}
.plantao.venc .pl-txt strong{color:var(--warn)}
.plantao .btn{flex:none;white-space:nowrap}
.seg.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.seg.two label{min-height:56px;font-size:.88rem;line-height:1.2}
.rel-actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
textarea{font-size:16px}
h1,h2,h3{font-family:var(--f-display);margin:0;text-wrap:balance;letter-spacing:-.01em}
h2{font-size:1.1rem;font-weight:600}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:3px solid color-mix(in srgb,var(--brand) 60%,transparent);outline-offset:2px}
.ic{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:.92em}
.muted{color:var(--muted)}

.wrap{max-width:860px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
main.wrap{padding-block:16px 120px;display:grid;gap:22px}

.chrome{position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.top{background:var(--surface);border-bottom:1px solid var(--line);border-top:3px solid var(--brand)}
.bar{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:8px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:auto;height:40px;max-width:150px;border-radius:0;object-fit:contain;background:none;flex:none}
.logo.ph{width:40px}
.logo.ph{display:grid;place-items:center;border:1.5px dashed var(--line);color:var(--muted);font-size:.58rem;font-weight:700;letter-spacing:.08em}
.brand-txt{display:grid;min-width:0}
.brand-txt strong{font-family:var(--f-display);font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand-txt span{font-size:.76rem;color:var(--muted)}
.perfil{display:flex;align-items:center;gap:8px;font-size:.78rem;color:var(--muted)}
.perfil select{min-height:38px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);padding:0 8px;font-weight:700;color:var(--fg)}

.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);z-index:20}
.tabs-in{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;max-width:860px;margin:0 auto}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:60px;border:0;background:none;color:var(--muted);font-size:.78rem;font-weight:700;cursor:pointer}
.tab.on{color:var(--brand-text)}
:root[data-layout="desktop"] .tabs{position:static;border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
:root[data-layout="desktop"] .tabs-in{display:flex;gap:4px;max-width:1280px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
:root[data-layout="desktop"] .tab{flex-direction:row;min-height:46px;padding:0 14px;gap:8px;font-size:.9rem;border-bottom:3px solid transparent}
:root[data-layout="desktop"] .tab.on{border-bottom-color:var(--brand-text)}
:root[data-layout="desktop"] main.wrap{padding-bottom:40px}
:root[data-layout="desktop"] .wrap{max-width:1280px}
:root[data-layout="mobile"] .wrap,:root[data-layout="mobile"] .tabs-in{max-width:560px}
.cols{display:grid;gap:22px;min-width:0}
.cols>*{min-width:0}
:root[data-layout="desktop"] .cols{grid-template-columns:minmax(0,1.5fr) minmax(300px,1fr);align-items:start}
:root[data-layout="desktop"] .side{position:sticky;top:calc(env(safe-area-inset-top,0px) + 118px);max-height:calc(100vh - 140px);overflow:auto;display:grid;gap:16px;padding-bottom:4px}
.bar-right{display:flex;align-items:center;gap:8px;flex:none}
.lay-btn{width:40px;height:38px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);display:grid;place-items:center;cursor:pointer;color:var(--muted)}
.lay-btn .ic{width:20px;height:20px}
.btn.wa{background:var(--ok);color:#fff;text-decoration:none}
.lay-choices{display:grid;gap:8px}
.lay-choices .choice{justify-content:flex-start;padding:10px 14px;min-height:64px;text-align:left;gap:12px}
.lay-choices .choice span{display:grid;gap:2px}
.lay-choices .choice small{font-weight:400;color:var(--muted);font-size:.84rem}
.day{padding:16px;display:grid;gap:12px}
.mini-tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:4px 12px}
.mini-tiles div{display:grid;padding:6px 0}
.mini-tiles b{font-family:var(--f-display);font-size:1.6rem;line-height:1.1;font-variant-numeric:tabular-nums}
.mini-tiles span{font-size:.82rem;color:var(--muted)}
.rel-btn{justify-self:start}
@media (max-width:480px){
  .perfil>span,.brand-txt span{display:none}
  .bar{flex-wrap:nowrap}
  .perfil select{max-width:130px}
  .searchbox{min-height:60px;padding-left:12px;gap:6px}
  .searchbox input{font-size:1.15rem}
  .kb{min-width:48px}
  .seg label{font-size:.82rem;padding:4px 2px}
  .choice.big{min-height:52px;font-size:.95rem}
  .dest-grid{grid-template-columns:repeat(2,minmax(0,1fr))}
  .rel-btn{justify-self:stretch}
  .btn{white-space:normal;line-height:1.2;text-align:center}
  .plantao{padding-left:12px}
  .rel-actions{grid-template-columns:minmax(0,1fr)}
  .grid2{grid-template-columns:minmax(0,1fr)}
}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:6px;border:1px solid transparent;background:var(--brand);color:var(--on-brand);font-weight:700;cursor:pointer;white-space:nowrap}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.out{background:var(--surface);color:var(--brand-text);border-color:color-mix(in srgb,var(--brand) 45%,var(--line))}
.btn.sm{min-height:40px;padding:0 14px;font-size:.9rem}
.btn.danger{background:var(--danger);color:#fff}
.btn.wide{width:100%}
.linkbtn{background:none;border:0;color:var(--brand-text);font-weight:700;cursor:pointer;padding:8px 2px;min-height:40px}
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 8px;border-radius:4px;font-size:.75rem;font-weight:700;background:var(--sunk);color:var(--muted);white-space:nowrap}
.chip.ok{background:var(--ok-soft);color:var(--ok)}
.chip.warn{background:var(--warn-soft);color:var(--warn)}
.chip.danger{background:var(--danger-soft);color:var(--danger)}
.chip.brand{background:var(--brand-soft);color:var(--brand-text)}
.eyebrow{font-size:.74rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.sec-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px;flex-wrap:wrap}
.count{font-family:var(--f-mono);font-weight:500;background:var(--brand);color:var(--on-brand);border-radius:4px;padding:1px 10px;font-size:.85rem}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:6px}
.note{font-size:.88rem;color:var(--muted);margin:0}

.searchbox{display:flex;align-items:center;gap:10px;background:var(--surface);border:2px solid var(--line);border-radius:6px;padding:0 8px 0 16px;min-height:66px}
.searchbox:focus-within{border-color:var(--brand-text)}
.searchbox input{flex:1;min-width:0;border:0;background:none;font-size:1.3rem;outline:none;padding:12px 0;font-family:var(--f-mono)}
.searchbox input::placeholder{font-family:var(--f-body);color:var(--muted)}
.searchbox>.ic{color:var(--muted);width:24px;height:24px}
.kb{min-height:44px;min-width:56px;border-radius:6px;border:1px solid var(--line);background:var(--sunk);font-weight:700;font-size:.82rem;color:var(--muted);cursor:pointer}
.clear{width:44px;height:44px;border-radius:6px;border:0;background:none;color:var(--muted);display:grid;place-items:center;cursor:pointer}
#area{margin-top:14px;display:grid;gap:12px}

.list{list-style:none;margin:0;padding:0;background:var(--surface);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.list>li+li{border-top:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;padding:10px 12px}
.row-main{flex:1;min-width:0;cursor:pointer;display:flex;align-items:center;gap:12px;background:none;border:0;text-align:left;padding:0}
.row-txt{min-width:0;display:grid;gap:3px}
.row-txt strong{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:1.02rem}
.row-meta{display:flex;gap:6px;flex-wrap:wrap;align-items:center;font-size:.84rem;color:var(--muted)}
.av{width:44px;height:44px;border-radius:50%;flex:none;display:grid;place-items:center;font-family:var(--f-display);font-weight:700;background:var(--brand-soft);color:var(--brand-text);object-fit:cover;font-size:.95rem}
.av.lg{width:84px;height:84px;font-size:1.6rem}
.act{flex:none;min-width:112px}
@media (max-width:420px){.act{min-width:96px;padding:0 12px}.row-main .av{width:38px;height:38px}}
.empty{padding:22px 16px;text-align:center;color:var(--muted)}

.dest{display:grid;gap:10px;padding:2px 12px 14px}
.dest-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.choice{display:flex;align-items:center;justify-content:center;gap:6px;min-height:46px;padding:0 12px;border-radius:6px;border:1.5px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;font-size:.95rem;text-align:center}
.choice.big{min-height:56px;font-size:1rem}
.choice.prim{border-color:var(--brand-text);background:var(--brand-soft);color:var(--brand-text)}
.choice:hover{border-color:var(--brand-text)}
.choice .ic{width:18px;height:18px}

.quick{padding:16px;display:grid;gap:14px}
form.cad{display:grid;gap:14px}
.field{display:grid;gap:6px}
.field>label,.lbl{font-weight:700;font-size:.9rem}
.field input,.field select,.field textarea{min-height:50px;border:1px solid var(--line);border-radius:6px;background:var(--surface);padding:10px 12px;font-size:1.02rem;width:100%}
.field textarea{min-height:76px;resize:vertical}
.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--brand-text);outline:none}
.field input[readonly]{background:var(--sunk)}
.err{color:var(--danger);font-size:.88rem}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg input{position:absolute;opacity:0;pointer-events:none}
.seg label{display:flex;align-items:center;justify-content:center;gap:6px;text-align:center;min-height:46px;padding:4px 6px;border:1.5px solid var(--line);border-radius:6px;background:var(--surface);font-weight:700;cursor:pointer;font-size:.9rem}
.seg label .ic{width:17px;height:17px}
.seg label:has(input:checked){border-color:var(--brand-text);background:var(--brand-soft);color:var(--brand-text)}
.seg label.warn:has(input:checked){border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
.seg label.danger:has(input:checked){border-color:var(--danger);background:var(--danger-soft);color:var(--danger)}
.seg label:has(input:focus-visible){outline:3px solid color-mix(in srgb,var(--brand) 60%,transparent)}
details.mais{border:1px solid var(--line);border-radius:6px;background:var(--sunk)}
details.mais>summary{cursor:pointer;padding:12px 14px;font-weight:700;font-size:.92rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.mais>summary::-webkit-details-marker{display:none}
details.mais>summary::after{content:"+";font-size:1.2rem;color:var(--muted)}
details.mais[open]>summary::after{content:"−"}
.mais-in{display:grid;gap:14px;padding:0 14px 14px}
.foto-box{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.check{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:6px;background:var(--surface);cursor:pointer;font-size:.9rem}
.check input{width:22px;height:22px;margin:0;accent-color:var(--brand-text);flex:none}
.form-actions{display:flex;gap:10px;flex-wrap:wrap}
.form-actions .btn{flex:1 1 180px}
.form-actions .btn:first-child{flex:2 1 220px}

.alert{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border:1px solid var(--line);border-left:3px solid var(--line);background:var(--surface);font-size:.92rem}
.alert.warn{border-left-color:var(--warn)}.alert.warn strong{color:var(--warn)}
.alert.danger{border-left-color:var(--danger)}.alert.danger strong{color:var(--danger)}
.alert strong{display:block}
.alert p{margin:2px 0 0;color:var(--fg)}

.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:end}
.filters .field{flex:1 1 150px}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.tile{padding:14px 16px;display:grid;gap:2px}
.tile b{font-family:var(--f-display);font-size:2rem;line-height:1.1;font-variant-numeric:tabular-nums}
.tile span{font-size:.85rem;color:var(--muted)}
.chart{padding:16px}
.bars{display:flex;align-items:flex-end;gap:4px;height:140px;margin-top:10px}
.bar-col{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:4px}
.bar-col i{display:block;width:100%;max-width:28px;background:var(--brand);border-radius:4px;min-height:2px}
.bar-col.zero i{background:var(--line)}
.bar-col em,.bar-col small{font-style:normal;font-family:var(--f-mono);font-size:.68rem;color:var(--muted)}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:6px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:720px;font-size:.9rem}
th,td{padding:10px 12px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:.74rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
tbody tr:last-child td{border-bottom:0}
td .link,.rg-b .link{background:none;border:0;padding:0;color:var(--brand-text);font-weight:700;cursor:pointer;text-align:left;font:inherit}
.dentro-tag{color:var(--ok);font-weight:700}

.cfg{display:grid;gap:16px;padding:18px}
.swatches{display:flex;gap:10px;flex-wrap:wrap}
.sw{width:44px;height:44px;border-radius:50%;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer}
.sw.on{box-shadow:0 0 0 3px var(--fg)}
.users{min-width:0}.users td,.users th{white-space:normal}

[hidden]{display:none!important}
.sheet{position:fixed;inset:0;z-index:50;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet-panel{background:var(--surface);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:4px 8px 0 0;padding:18px max(18px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(18px,env(safe-area-inset-left,0px));display:grid;gap:16px;align-content:start}
@media (min-width:700px){.sheet{align-items:center}.sheet-panel{border-radius:6px;max-height:88%}}
.sheet-head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.icon-btn{width:44px;height:44px;border-radius:6px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.95rem;margin:0}
.kv dt{color:var(--muted)}
.kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.mini-hist{display:grid;gap:6px;font-size:.88rem}

function bindForm(form){
  if(!form||form.dataset.bound)return;form.dataset.bound='1';
  const el=n=>form.elements[n];
  form.addEventListener('submit',e=>{e.preventDefault();salvar(form,(e.submitter&&e.submitter.dataset.modo)||'entrada')});
  form.querySelectorAll('[name=tipo]').forEach(r=>r.addEventListener('change',()=>{form.querySelector('[data-g=alunos]').hidden=r.value!=='responsavel';form.querySelector('[data-g=empresa]').hidden=r.value!=='prestador';form.querySelector('[data-g=validade]').hidden=r.value!=='responsavel';if(r.value==='prestador'){form.querySelector('[data-g=placa]').hidden=false;form.querySelector('[data-g=placaLink]').hidden=true}}));
  form.querySelectorAll('[name=nivel]').forEach(r=>r.addEventListener('change',()=>{form.querySelector('[data-g=motivo]').hidden=!r.value}));
  if(!el('cpf').readOnly)el('cpf').addEventListener('input',()=>{el('cpf').value=maskInputCPF(el('cpf').value)});
  el('tel').addEventListener('input',()=>{el('tel').value=maskTel(el('tel').value)});
  el('placa').addEventListener('input',()=>{el('placa').value=el('placa').value.toUpperCase().replace(/[^A-Z0-9-]/g,'').slice(0,8)});
  el('foto').addEventListener('change',e=>{const f=e.target.files[0];if(f)lerImagem(f,320,u=>{ui.fotoTmp=u;form.querySelector('[data-foto]').innerHTML=`<img class="av lg" src="${u}" alt="Foto">`})});
}
function salvar(form,modo){
  const el=n=>form.elements[n];
  const editId=form.dataset.pre==='e'?ui.editId:null;
  const tipo=form.querySelector('[name=tipo]:checked').value;
  const nome=el('nome').value.trim().replace(/\s+/g,' ');
  const cpf=digits(el('cpf').value);
  const err=form.querySelector('[data-err]');err.hidden=true;
  if(cpf){const dup=db.pessoas.find(p=>p.cpf===cpf&&p.id!==editId);if(dup){err.innerHTML=`Este CPF já tem cadastro: ${esc(nm(dup))}. <button type="button" class="linkbtn" data-act="usar" data-id="${dup.id}">Usar esse cadastro</button>`;err.hidden=false;return}}
  const nivel=form.querySelector('[name=nivel]:checked').value;
  const mot=el('motivoAl').value.trim();
  const alerta=nivel?{nivel,motivo:mot||(nivel==='bloqueado'?'Pessoa bloqueada. Não liberar sem falar com a gestão.':'Atenção ao receber esta pessoa.')}:null;
  const dados={nome,tipo,validade:tipo==='responsavel'?(el('validade').value||''):'',placa:el('placa').value.trim().toUpperCase(),tel:digits(el('tel').value),empresa:tipo==='prestador'?el('empresa').value.trim():'',alunos:tipo==='responsavel'?parseAlunos(el('alunos').value):[],alerta};
  const aviso=cpf&&!cpfValido(cpf)?' Confira o CPF depois, parece ter número trocado.':'';
  let p;
  const antes=editId&&pessoa(editId).alerta?pessoa(editId).alerta.nivel:'';
  if(editId){p=pessoa(editId);audit('Cadastro editado',nm(p));Object.assign(p,dados);if(!p.cpf&&cpf)p.cpf=cpf;if(ui.fotoTmp!==null)p.foto=ui.fotoTmp}
  else{p={id:uid(),cpf,foto:ui.fotoTmp||'',criadoEm:Date.now(),...dados};db.pessoas.push(p);logar('cad','Cadastro novo',nm(p)+' · '+TIPOS[p.tipo])}
  if(nivel==='bloqueado'&&antes!=='bloqueado')logar('bloq','Pessoa bloqueada',nm(p)+(mot?' · '+mot:''));
  else if(antes==='bloqueado'&&nivel!=='bloqueado')logar('bloq','Bloqueio removido',nm(p));
  save();ui.fotoTmp=null;
  if(editId){ui.editId=null;fecharSheet();render();toast('Cadastro atualizado.'+aviso);return}
  ui.q='';ui.novo=false;ui.aberto=null;
  if(modo==='entrada'){ui.foco=p.id;render();window.scrollTo(0,0);toast('Cadastro salvo. Agora toque no destino.'+aviso)}
  else{render();focusBusca();toast((isBloq(p)?'Pessoa bloqueada cadastrada.':'Cadastro salvo.')+aviso)}
}

function periodoIni(){const d=new Date();d.setHours(0,0,0,0);if(ui.periodo==='7')d.setDate(d.getDate()-6);if(ui.periodo==='30')d.setDate(d.getDate()-29);return d.getTime()}

    </tbody></table></div>`:`<div class="list"><p class="empty">Nenhuma entrada ${per} com esses filtros.</p></div>`}
    ${(()=>{const km=db.movChaves.filter(m=>m.retirada>=periodoIni()).sort((a,b)=>b.retirada-a.retirada);

function grafico(vs){
  const ini=periodoIni(),dias=ui.periodo==='7'?7:30,cont=[];
  for(let i=0;i<dias;i++){const d=new Date(ini);d.setDate(d.getDate()+i);const a=d.getTime(),b=a+86400000;cont.push({d,n:vs.filter(v=>v.entrada>=a&&v.entrada<b).length})}
  const max=Math.max(1,...cont.map(c=>c.n));
  const lbl=(c,i)=>dias===7?['dom','seg','ter','qua','qui','sex','sáb'][c.d.getDay()]:(i%5===0||i===dias-1?pad(c.d.getDate()):'');
  return `<div class="panel chart"><p class="eyebrow">Entradas por dia</p><div class="bars" role="img" aria-label="Gráfico de entradas por dia">${cont.map((c,i)=>`<div class="bar-col${c.n?'':' zero'}" title="${dataBR(c.d)}: ${c.n} entradas"><em>${c.n&&(dias===7||c.n===max)?c.n:''}</em><i style="height:${Math.round(c.n/max*100)}%"></i><small>${lbl(c,i)}</small></div>`).join('')}</div></div>`;
}
function tsv(){
  const G=perfil().gerir,L=[['Data','Hora','Tipo','Nome / registro','Detalhes','Registrado por'].concat(G?['Conferência']:[])];
  rgFiltrados().slice().reverse().forEach(e=>{let c='';if(G&&e.k==='ent_cat'){const x=avalCatraca(e.cat);c=x.st==='ok'?'Porteiro registrou antes':x.st==='depois'?'Porteiro registrou depois':'Sem registro do porteiro'}
    L.push([dataBR(e.t),hhmm(e.t),RG_TIPOS[e.k][0],e.titulo,e.linhas.filter(Boolean).join(' · '),e.por||''].concat(G?[c]:[]).map(x=>String(x).replace(/[\t\n]/g,' ')))});
  return L.map(l=>l.join('\t')).join('\n');
}

const kFora=()=>db.movChaves.filter(m=>!m.devolucao).sort((a,b)=>a.retirada-b.retirada);

function kTabelaFora(ms){return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Chave</th><th>Com</th><th>Desde</th><th></th></tr></thead><tbody>${ms.map(m=>`<tr><td><button class="link" data-act="kInfo" data-id="${m.chaveId}">${esc(kNome(m))}</button></td><td>${esc(fNome(m))}</td><td class="mono">${m.retirada<hoje0()?fmtDH(m.retirada):hhmm(m.retirada)}${m.obs?`<br><span class="muted">${esc(m.obs)}</span>`:''}</td><td><button class="btn kdev sm" data-act="kDevolver" data-id="${m.id}">${ic('check')}Devolver</button></td></tr>`).join('')}</tbody></table></div>`}
function kTabelaHist(ms){return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Chave</th><th>Com</th><th>Retirada</th><th>Devolução</th><th>Situação</th></tr></thead><tbody>${ms.map(m=>`<tr><td>${esc(kNome(m))}</td><td>${esc(fNome(m))}</td><td class="mono">${hhmm(m.retirada)}</td><td class="mono">${m.devolucao?hhmm(m.devolucao):'—'}</td><td>${m.devolucao?'<span class="chip ok">devolvida</span>':'<span class="chip warn">retirada</span>'}</td></tr>`).join('')}</tbody></table></div>`}
function kRow(m){

function keyGrid(){
  if(!db.chaves.length)return `<div class="list"><p class="empty">Nenhuma chave cadastrada. <button class="linkbtn" data-act="ckNova">+ Cadastrar chave</button></p></div>`;

function kHist(){

function sugFunc(q){
  const n=norm(q).trim(),freq={};db.movChaves.forEach(m=>{freq[m.funcId]=(freq[m.funcId]||0)+1});
  const fs=db.funcionarios.filter(f=>!n||norm(f.nome).includes(n)).sort((a,b)=>(freq[b.id]||0)-(freq[a.id]||0)).slice(0,8);
  const existe=n&&db.funcionarios.some(f=>norm(f.nome)===n);
  return fs.map(f=>`<button class="choice${ui.kSel&&ui.kSel.fid===f.id?' on':''}" data-act="kFuncSel" data-id="${f.id}">${esc(f.nome)}${f.funcao?`<small class="muted">· ${esc(f.funcao)}</small>`:''}</button>`).join('')+(n&&!existe?`<span class="note">"${esc(q.trim())}" vai entrar na lista de funcionários.</span>`:'');

const AGT={visita:'Visita',retirada:'Buscar aluno',prestador:'Prestador',reuniao:'Reunião'};
const COMS=['Secretaria','Direção','Coordenação'];
function comDest(c){if(!c)return'';const k=norm(c).slice(0,5);return (db.config.destinos||[]).find(d=>norm(d).includes(k))||''}
const hojeISO=()=>isoDia(new Date());
const agFim=a=>a.fim||a.ini;
const agById=id=>(db.agenda||[]).find(a=>a.id===id);
const agAtivosHoje=()=>{const h=hojeISO();return (db.agenda||[]).filter(a=>a.ini<=h&&agFim(a)>=h).sort((x,y)=>(x.hora||'99').localeCompare(y.hora||'99'))};
const agChegouHoje=a=>(a.chegadas||[]).filter(c=>c.t>=hoje0()).pop();
function agMatch(p){if(!p||!db.agenda)return null;return agAtivosHoje().find(a=>(a.cpf&&p.cpf&&digits(a.cpf)===p.cpf)||(a.nome&&p.nome&&norm(a.nome)===norm(p.nome)))||null}
function agQuando(a){const f=d=>{const x=new Date(d+'T00:00:00');return pad(x.getDate())+'/'+pad(x.getMonth()+1)};const h=hojeISO();
  return (a.fim&&a.fim!==a.ini?`${f(a.ini)} a ${f(a.fim)}`:(a.ini===h?'Hoje':f(a.ini)))+(a.hora?' · '+a.hora:'')}
function agRow(a,acao){const ch=agChegouHoje(a);
  return `<li class="row"><span class="ti k-ag">${ic('cal')}</span><button class="row-main" data-act="agVer" data-id="${a.id}"><span class="row-txt"><strong>${esc(a.nome)}</strong><span class="row-meta"><span class="chip ag">${AGT[a.tipo]||''}${a.com?' · '+esc(a.com):''}</span><span>${esc(agQuando(a))}</span>${a.aluno?`<span>· ${esc(a.aluno)}</span>`:''}${a.destino?`<span>· ${esc(a.destino)}</span>`:''}${ch?`<span class="chip ok">chegou ${hhmm(ch.t)}</span>`:''}</span>${a.obs?`<span class="row-meta">${esc(a.obs)}</span>`:''}</span></button>${acao||''}</li>`}
function agHojeHTML(){const ls=agAtivosHoje();const h=hojeISO();const prox=(db.agenda||[]).filter(a=>a.ini>h).sort((x,y)=>(x.ini+(x.hora||'')).localeCompare(y.ini+(y.hora||'')));if(!ls.length&&!prox.length)return '';const P=perfil();
  const proxTxt=prox.length?`<p class="note" style="margin-top:8px">${ic('cal').replace('class="ic"','class="ic" style="width:14px;height:14px;vertical-align:-2px"')} Próximos dias: ${prox.slice(0,3).map(a=>`${esc(primeiro(a.nome))} (${AGT[a.tipo]}${a.com?' com '+esc(a.com):''}, ${esc(agQuando(a))})`).join(' · ')}${prox.length>3?` e mais ${prox.length-3}`:''}</p>`:'';
  if(!ls.length)return `<div><div class="sec-head"><h2 class="h-ag">${ic('cal')}Agendados para hoje</h2><span class="count ag">0</span></div><div class="list"><p class="empty">Nada agendado para hoje.</p></div>${proxTxt}</div>`;

/* ===== CALENDÁRIO DA SECRETARIA ===== */
const DOWS=['dom','seg','ter','qua','qui','sex','sáb'],DOWL=['Domingo','Segunda','Terça','Quarta','Quinta','Sexta','Sábado'],MESES=['janeiro','fevereiro','março','abril','maio','junho','julho','agosto','setembro','outubro','novembro','dezembro'];
const CT={reuniao_int:'Reunião interna',tarefa:'Tarefa',lembrete:'Lembrete',outro:'Compromisso'};
const VIS={eu:'Só eu',setor:'Meu setor',todos:'Toda a equipe'};
const REP={'':'Não repete',uteis:'Todo dia útil',semanal:'Toda semana',mensal:'Todo mês'};
const dISO=iso=>new Date(iso+'T00:00:00');
const addDias=(iso,n)=>{const d=dISO(iso);d.setDate(d.getDate()+n);return isoDia(d)};
const dowDe=iso=>dISO(iso).getDay();
const segDa=iso=>addDias(iso,-((dowDe(iso)+6)%7));
const hm2m=h=>{const [a,b]=String(h||'0:0').split(':').map(Number);return a*60+(b||0)};
const m2hm=m=>pad(Math.floor(m/60))+':'+pad(m%60);
const diaLongo=iso=>{const d=dISO(iso);return `${DOWL[d.getDay()]}, ${d.getDate()} de ${MESES[d.getMonth()]}`};
function setorDe(u){return u?(u.setor||PERFIL_NOME[u.perfil]||''):''}
function compVisivel(c){const u=usuarioAtual();if(!u)return false;if(c.vis==='todos')return true;if(c.dono===u.id)return true;if(c.vis==='setor')return c.setor===setorDe(u);return false}
function compOcorre(c,d){if(d<c.data)return false;if(c.ate&&d>c.ate)return false;
  if(!c.repetir)return d===c.data;if(c.repetir==='uteis'){const w=dowDe(d);return w>0&&w<6}
  if(c.repetir==='semanal')return dowDe(d)===dowDe(c.data);if(c.repetir==='mensal')return dISO(d).getDate()===dISO(c.data).getDate();return false}
function podeEditarComp(c){const u=usuarioAtual();return !!u&&(c.dono===u.id||u.perfil==='admin'||u.perfil==='gestor')}
function calItens(d0,d1){const out=[];const F=ui.calF||'tudo',me=(usuarioAtual()||{}).id;
  for(let d=d0;d<=d1;d=addDias(d,1)){
    if(F!=='interno'&&F!=='meus')(db.agenda||[]).forEach(a=>{if(a.ini<=d&&agFim(a)>=d){const ch=d===hojeISO()?agChegouHoje(a):null;
      out.push({d,src:'ag',id:a.id,hora:a.hora||'',fim:a.hora&&a.tipo==='reuniao'?m2hm(hm2m(a.hora)+(db.config.atendimento.dur||30)):'',titulo:(a.tipo==='reuniao'?'Reunião: ':'')+a.nome,
        sub:[AGT[a.tipo]+(a.com?' com '+a.com:''),a.aluno].filter(Boolean).join(' · '),cls:a.tipo==='reuniao'?'c-reu':'c-ag',chegou:ch?hhmm(ch.t):''})}});
    if(F!=='portaria')(db.compromissos||[]).forEach(c=>{if(!compVisivel(c)||!compOcorre(c,d))return;if(F==='meus'&&c.dono!==me)return;
      out.push({d,src:'comp',id:c.id,hora:c.hora||'',fim:c.fim||'',titulo:c.titulo,sub:[CT[c.tipo],c.vis==='eu'?'só você':c.vis==='setor'?c.setor:'equipe',c.local].filter(Boolean).join(' · '),
        cls:{reuniao_int:'c-int',tarefa:'c-tar',lembrete:'c-lem'}[c.tipo]||'c-int',feito:!!(c.feitos&&c.feitos[d]),tarefa:c.tipo==='tarefa',priv:c.vis==='eu'})});
  }
  return out.sort((x,y)=>(x.d+(x.hora||'00:00')).localeCompare(y.d+(y.hora||'00:00')))}
function calChip(e,curto){return `<button class="cev ${e.cls}${e.feito?' feito':''}" data-act="calVer" data-id="${e.src}|${e.id}|${e.d}" title="${esc(e.titulo)}">${e.hora?`<b class="mono">${e.hora}</b>`:''}<span>${e.priv?'🔒 ':''}${e.tarefa?(e.feito?'☑ ':'☐ '):''}${esc(e.titulo)}</span>${!curto&&e.sub?`<small>${esc(e.sub)}</small>`:''}${e.chegou?`<i class="chip ok">chegou ${e.chegou}</i>`:''}</button>`}
function calDiaHTML(d){const it=calItens(d,d),semHora=it.filter(e=>!e.hora),A=db.config.atendimento,h0=7,h1=19;const agora=new Date(),hoje=d===hojeISO();
  let rows='';for(let h=h0;h<=h1;h++){const hs=pad(h)+':00',ls=it.filter(e=>e.hora&&Number(e.hora.slice(0,2))===h);const now=hoje&&agora.getHours()===h;

function calSemanaHTML(d){const s0=segDa(d);let cols='';for(let i=0;i<7;i++){const di=addDias(s0,i),it=calItens(di,di),hj=di===hojeISO();
    cols+=`<div class="cwd${hj?' hoje':''}${i>4?' fds':''}"><button class="cwh" data-act="calIr" data-id="dia|${di}"><span>${DOWS[dowDe(di)]}</span><b>${dISO(di).getDate()}</b></button><div class="cwl">${it.map(e=>calChip(e,true)).join('')||'<span class="note">—</span>'}</div><button class="cadd w" data-act="calNovo" data-id="${di}|" aria-label="Novo em ${dataBR(dISO(di))}">${ic('plus')}</button></div>`}
  return `<div class="cweek">${cols}</div>`}
function calMesHTML(d){const x=dISO(d),m=x.getMonth(),p1=isoDia(new Date(x.getFullYear(),m,1)),ini=segDa(p1);let cells='';
  for(let i=0;i<42;i++){const di=addDias(ini,i),dd=dISO(di);if(i>=35&&dd.getMonth()!==m)break;const it=calItens(di,di),fora=dd.getMonth()!==m,hj=di===hojeISO();

function calTabela(it){return `<div class="tbl-wrap"><table class="tbl tbl-compact tbl-cal"><thead><tr><th>Data</th><th>Hora</th><th>Compromisso</th><th>Detalhe</th></tr></thead><tbody>${it.map(e=>`<tr${e.feito?' style="opacity:.6"':''}><td class="mono">${dataBR(dISO(e.d).getTime())}</td><td class="mono">${e.hora||'—'}</td><td><button class="link" data-act="calVer" data-id="${e.src}|${e.id}|${e.d}">${e.priv?'Privado · ':''}${e.tarefa?(e.feito?'☑ ':'☐ '):''}${esc(e.titulo)}</button>${e.chegou?` <span class="chip ok">chegou ${e.chegou}</span>`:''}</td><td class="muted">${esc(e.sub||'')}</td></tr>`).join('')}</tbody></table></div>`}

function calTitulo(){const v=ui.calView||'semana',d=ui.calDia||hojeISO(),x=dISO(d);

function slotsDia(d,com,ignorarReu){const A=db.config.atendimento;if(!A||!A.dias.includes(dowDe(d)))return [];const out=[],dur=Number(A.dur)||30,agora=new Date(),hoje=d===hojeISO(),nowM=agora.getHours()*60+agora.getMinutes();
  for(let m=hm2m(A.ini);m+dur<=hm2m(A.fim);m+=dur){if(A.pIni&&A.pFim&&m<hm2m(A.pFim)&&m+dur>hm2m(A.pIni))continue;const h=m2hm(m);let livre=!(hoje&&m<=nowM)&&d>=hojeISO();
    if(livre&&(db.agenda||[]).some(a=>a.tipo==='reuniao'&&a.ini===d&&a.hora===h&&(a.com||'')===com))livre=false;
    if(livre&&(db.reunioes||[]).some(r=>r.id!==ignorarReu&&r.status==='pendente'&&r.data===d&&r.hora===h&&r.com===com))livre=false;
    if(livre&&(db.compromissos||[]).some(c=>c.bloq&&c.hora&&compOcorre(c,d)&&hm2m(c.hora)<m+dur&&(c.fim?hm2m(c.fim):hm2m(c.hora)+dur)>m))livre=false;
    out.push({h,livre})}
  return out}
function conflitoReu(d,h,com,ignorarAg){return !!h&&(db.agenda||[]).some(a=>a.id!==ignorarAg&&a.tipo==='reuniao'&&a.ini===d&&a.hora===h&&(a.com||'')===com)}

/* QR temporário de entrada na catraca, gerado quando a reunião é confirmada */

function desenharQR(el,texto){if(!qrLib)qrLib=carregar('https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js').catch(e=>{qrLib=null;throw e});qrLib.then(()=>{if(window.QRCode){el.innerHTML='';new window.QRCode(el,{text:texto,width:180,height:180,correctLevel:window.QRCode.CorrectLevel.M})}}).catch(()=>{el.innerHTML='<p class="note">Não foi possível gerar o QR agora. Anote o código.</p>'})}

function aprovarSol(x,bloq){
  const alunos=x.alunos.filter(a=>a.nome).map(a=>({nome:a.nome,turma:a.turma||''}));
  const achar=d=>{const cpf=digits(d.cpf||'');return (cpf&&db.pessoas.find(p=>p.cpf===cpf))||db.pessoas.find(p=>norm(p.nome)===norm(d.nome))};
  const upsert=d=>{let p=achar(d);const cpf=digits(d.cpf||'');
    if(p){p.tipo='responsavel';if(!p.cpf&&cpf)p.cpf=cpf;if(!p.tel&&d.tel)p.tel=d.tel;if(d.parentesco)p.parentesco=d.parentesco;if(d.validade!==undefined&&d.nome!==x.resp.nome)p.validade=d.validade||'';if(d.foto&&!p.foto)p.foto=d.foto;alunos.forEach(a=>{if(!p.alunos.some(z=>norm(z.nome)===norm(a.nome)))p.alunos.push({...a})})}
    else{p={id:uid(),nome:d.nome,cpf,tel:d.tel||'',tipo:'responsavel',empresa:'',placa:'',alunos:alunos.map(a=>({...a})),foto:d.foto||'',alerta:null,parentesco:d.parentesco||'',validade:d.validade||'',origem:'pais',criadoEm:Date.now()};db.pessoas.push(p)}
    return p};
  const pr=upsert(x.resp);x.autorizados.forEach(upsert);
  if(bloq&&x.restricao){const r=x.restricao;let p=achar(r);
    const mot=`Não pode buscar ${alunos.map(a=>primeiro(a.nome)).join(', ')}. Informado por ${x.resp.nome}${r.motivo?': '+r.motivo:''}`;
    if(!p){p={id:uid(),nome:r.nome,cpf:digits(r.cpf||''),tel:'',tipo:'visitante',empresa:'',placa:'',alunos:[],foto:'',alerta:null,criadoEm:Date.now()};db.pessoas.push(p)}
    p.alerta={nivel:'bloqueado',motivo:mot};logar('bloq','Pessoa bloqueada',nm(p)+' · pedido do responsável')}
  x.status='aprovado';x.analisadoPor=quem();x.analisadoEm=Date.now();
  logar('cad','Cadastro dos pais aprovado',`${x.resp.nome} · ${1+x.autorizados.length} pessoa(s) autorizada(s)`);
  const ct=(db.contasPais||[]).find(c=>c.solId===x.id);if(ct)ct.pessoaId=pr.id;
  return pr;
}

function dlAlunos(){return `<datalist id="dlAlunos">${(db.alunos||[]).map(a=>`<option value="${esc(alunoTxt(a))}">`).join('')}</datalist>`}
function abrirAlunos(){const ls=(db.alunos||[]);const q=norm(ui.alQ||'');const vis=ls.filter(a=>!q||norm(a.nome+' '+a.turma).includes(q)).slice(0,60);

      <button class="btn ghost del" data-act="alLimpar">${ic('trash')}${ui.alDel?'Toque de novo para limpar a lista':'Limpar a lista'}</button>`:''}`,'Lista de alunos');
  const f=$('#alFile');f.addEventListener('change',e=>{const x=e.target.files[0];if(x)importarAlunos(x)});
  const qq=$('#alQ');if(qq)qq.addEventListener('input',()=>{ui.alQ=qq.value;abrirAlunos();const n=$('#alQ');if(n){n.focus();n.setSelectionRange(n.value.length,n.value.length)}});
}
function linhasParaAlunos(rows){
  rows=rows.map(r=>(r||[]).map(c=>String(c??'').trim())).filter(r=>r.some(Boolean));if(!rows.length)return[];
  const h=rows[0].map(c=>norm(c));let iN=h.findIndex(c=>/nome|aluno|estudante/.test(c)),iT=h.findIndex(c=>/turma|serie|classe|sala|ano/.test(c));
  let corpo=rows;if(iN>=0)corpo=rows.slice(1);else{iN=0;iT=rows[0].length>1?1:-1}
  const vistos=new Set();return corpo.map(r=>({nome:(r[iN]||'').replace(/\s+/g,' '),turma:iT>=0?(r[iT]||''):''})).filter(a=>a.nome&&!/^\d+$/.test(a.nome)).filter(a=>{const k=norm(a.nome+'|'+a.turma);if(vistos.has(k))return false;vistos.add(k);return true});
}
function importarAlunos(file){
  const fim=ls=>{if(!ls.length){toast('Não encontrei nomes nessa planilha. Confira se tem uma coluna com o nome do aluno.');return}db.alunos=ls;audit('Lista de alunos importada',ls.length+' alunos');save();ui.alQ='';ui.alDel=false;abrirAlunos();toast(ls.length+' alunos importados.')};
  if(/\.(xlsx|xls)$/i.test(file.name)){
    if(!xlsxLib)xlsxLib=carregar('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js').catch(e=>{xlsxLib=null;throw e});
    xlsxLib.then(()=>{const r=new FileReader();r.onload=()=>{try{const wb=window.XLSX.read(new Uint8Array(r.result),{type:'array'});const sh=wb.Sheets[wb.SheetNames[0]];fim(linhasParaAlunos(window.XLSX.utils.sheet_to_json(sh,{header:1,raw:false})))}catch(e){toast('Não consegui ler essa planilha.')}};r.readAsArrayBuffer(file)}).catch(()=>toast('Sem internet para ler Excel. Tente salvar a planilha como CSV.'));
  }else{const r=new FileReader();r.onload=()=>{const t=String(r.result).replace(/^﻿/,'');const l1=t.split(/\r?\n/)[0]||'';const sep=(l1.match(/;/g)||[]).length>=(l1.match(/,/g)||[]).length?(l1.includes(';')?';':(l1.includes('\t')?'\t':',')):',';
    fim(linhasParaAlunos(t.split(/\r?\n/).map(l=>l.split(sep).map(c=>c.replace(/^"|"$/g,'')))))};r.readAsText(file)}
}

function salvarAtualizacao(f){const ct=contaPai();if(!ct)return;const old=(db.solicitacoes||[]).find(x=>x.id===ct.solId)||{autorizados:[],resp:{nome:ct.nome,cpf:ct.cpf,tel:ct.tel}};

/* HISTÓRICO */
function logar(k,txt,det,t){(db.log=db.log||[]).push({id:uid(),t:t||Date.now(),k,txt,det:det||''})}
const ocorrencias=(a,b)=>(db.log||[]).filter(l=>l.k==='oc'&&l.t>=a&&l.t<b).sort((x,y)=>x.t-y.t);
function eventos(a,b){
  const ev=[];
  db.visitas.forEach(v=>{const p=pessoa(v.pid);const n=p?nm(p):'Pessoa removida';
    if(v.entrada>=a&&v.entrada<b)ev.push({t:v.entrada,k:'in',txt:'Entrada: '+n,det:[p?TIPOS[p.tipo]:'',destinoTxt(v),v.aluno,v.placa?'placa '+v.placa:'',v.agenda?'agendado':''].filter(x=>x&&x!=='—').join(' · ')+(v.obs?' · exceção autorizada':''),exc:!!v.obs});
    if(v.saida&&v.saida>=a&&v.saida<b)ev.push({t:v.saida,k:'out',txt:'Saída: '+n,det:'entrou às '+hhmm(v.entrada)})});
  db.movChaves.forEach(m=>{
    if(m.retirada>=a&&m.retirada<b)ev.push({t:m.retirada,k:'kret',txt:'Chave retirada: '+kNome(m),det:fNome(m)+(m.obs?' · '+m.obs:'')});
    if(m.devolucao&&m.devolucao>=a&&m.devolucao<b)ev.push({t:m.devolucao,k:'kdev',txt:'Chave devolvida: '+kNome(m),det:fNome(m)})});
  (db.log||[]).forEach(l=>{if(l.t>=a&&l.t<b)ev.push({t:l.t,k:l.k,txt:l.txt,det:l.det,id:l.id})});
  return ev.sort((x,y)=>y.t-x.t);
}
function timeline(ev){
  const K={in:['in','k-in'],out:['out','k-out'],kret:['key','k-key'],kdev:['key','k-key'],oc:['alert','k-oc'],cad:['plus','k-in'],bloq:['alert','k-danger'],pl:['clock','k-pl'],ag:['cal','k-ag']};
  const h0=hoje0();
  return `<ul class="tl">${ev.map(e=>{const [i,c]=K[e.k]||['list','k-pl'];return `<li><time class="mono">${hhmm(e.t)}${e.t<h0?`<small>${dataBR(e.t)}</small>`:''}</time><span class="ti ${e.exc?'k-danger':c}">${ic(i)}</span><span class="tx"><strong>${esc(e.txt)}</strong>${e.det?`<span>${esc(e.det)}</span>`:''}</span></li>`}).join('')}</ul>`;
}
function rotuloDia(k){const h=isoDia(new Date());const o=new Date();o.setDate(o.getDate()-1);if(k===h)return 'Hoje';if(k===isoDia(o))return 'Ontem';const s=new Date(k+'T00:00:00').toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit'});return s.charAt(0).toUpperCase()+s.slice(1)}
function plantoesHTML(){
  if(!db.plantoes.length)return `<div><div class="sec-head"><h2>Plantões encerrados</h2></div><div class="list"><p class="empty">Quando um plantão for encerrado, ele fica guardado aqui com tudo o que aconteceu, organizado por dia.</p></div></div>`;
  const g={};db.plantoes.forEach(r=>{const k=isoDia(new Date(r.inicio));(g[k]=g[k]||[]).push(r)});
  return `<div style="display:grid;gap:14px"><div class="sec-head" style="margin:0"><h2>Plantões encerrados</h2></div>${Object.keys(g).sort().reverse().map(k=>`<div><p class="eyebrow" style="margin:0 0 6px">${rotuloDia(k)}</p><ul class="list">${g[k].map(r=>{const x=r.res||{};return `<li class="row"><button class="row-main" data-act="verPlantao" data-id="${r.id}"><span class="ti k-pl">${ic('clock')}</span><span class="row-txt"><strong class="mono">${hhmm(r.inicio)} – ${hhmm(r.fim)}${isoDia(new Date(r.fim))!==k?' ('+dataBR(r.fim)+')':''}</strong><span class="row-meta">${r.resp?esc(r.resp)+' · ':''}${x.entradas??0} entradas · ${x.kmov??0} chaves · ${x.oc??0} ocorrências</span></span></button></li>`}).join('')}</ul></div>`).join('')}</div>`;
}
/* REGISTROS (histórico + relatórios unificados) */
const RG_TIPOS={ent_port:['Entrada · porteiro','in','k-in'],sai_port:['Saída · porteiro','out','k-out'],ent_cat:['Entrada · catraca','in','k-cat'],sai_cat:['Saída · catraca','out','k-cat'],
  kret:['Chave retirada','key','k-key'],kdev:['Chave devolvida','key','k-key'],tent:['Tentativa de pessoa bloqueada','alert','k-danger'],bloq:['Bloqueio','alert','k-danger'],
  oc:['Ocorrência','alert','k-oc'],emg:['Modo emergência','alert','k-danger'],pl:['Plantão','clock','k-pl'],ag:['Agenda','cal','k-ag'],cad:['Cadastro','plus','k-in']};
const CAT_MET={qr:'QR code',rosto:'Reconhecimento facial',manual:'Liberada pelo porteiro no app'};
function rgPeriodo(){const k=ui.rgPer||'plantao',n=Date.now()+1;const d=new Date();d.setHours(0,0,0,0);
  if(k==='plantao')return [db.plantao.inicio,n,'neste plantão'];if(k==='hoje')return [d.getTime(),n,'hoje'];
  if(k==='7'){d.setDate(d.getDate()-6);return [d.getTime(),n,'nos últimos 7 dias']}if(k==='30'){d.setDate(d.getDate()-29);return [d.getTime(),n,'nos últimos 30 dias']}return [0,n,'em todo o período']}
function avalCatraca(c){const H=3*3600000;const vs=db.visitas.filter(v=>v.pid===c.pid&&Math.abs(v.entrada-c.t)<=H);
  const antes=vs.filter(v=>v.entrada<=c.t+60000&&v.entrada>=c.t-3600000&&(!v.saida||v.saida>=c.t-60000)).sort((a,b)=>b.entrada-a.entrada)[0];if(antes)return {st:'ok',t:antes.entrada,por:antes.por};
  const dep=vs.filter(v=>v.entrada>c.t).sort((a,b)=>a.entrada-b.entrada)[0];if(dep)return {st:'depois',t:dep.entrada,por:dep.por};return {st:'sem'}}
function registros(a,b){const r=[];
  db.visitas.forEach(v=>{const p=pessoa(v.pid);const n=p?nm(p):'Pessoa removida';
    if(v.entrada>=a&&v.entrada<b)r.push({id:'e'+v.id,t:v.entrada,k:'ent_port',pid:v.pid,titulo:n,linhas:[p?TIPOS[p.tipo]:'',destinoTxt(v)!=='—'?'Destino: '+destinoTxt(v):'',v.aluno?'Buscar '+v.aluno:'',v.placa?'Placa '+v.placa:'',v.agenda?'Visita agendada':'',v.obs||''],por:v.por||'',agenda:!!v.agenda,exc:!!v.obs});
    if(v.saida&&v.saida>=a&&v.saida<b)r.push({id:'s'+v.id,t:v.saida,k:'sai_port',pid:v.pid,titulo:n,linhas:['Entrou às '+hhmm(v.entrada)+(isoDia(new Date(v.entrada))!==isoDia(new Date(v.saida))?' de '+dataBR(v.entrada):'')],por:v.saidaPor||''})});
  (db.catraca||[]).forEach(c=>{if(c.t<a||c.t>=b)return;const p=pessoa(c.pid);
    r.push({id:'c'+c.id,t:c.t,k:c.sentido==='saida'?'sai_cat':'ent_cat',pid:c.pid,titulo:p?nm(p):(c.nome||'Pessoa não identificada'),linhas:['Catraca '+(c.catraca||'1'),CAT_MET[c.metodo]||''],por:c.por||'',sim:!!c.sim,cat:c})});
  db.movChaves.forEach(m=>{
    if(m.retirada>=a&&m.retirada<b)r.push({id:'kr'+m.id,t:m.retirada,k:'kret',titulo:kNome(m),linhas:['Com '+fNome(m),m.obs||''],por:m.por||''});
    if(m.devolucao&&m.devolucao>=a&&m.devolucao<b)r.push({id:'kd'+m.id,t:m.devolucao,k:'kdev',titulo:kNome(m),linhas:['Devolvida por '+fNome(m),'Retirada às '+hhmm(m.retirada)],por:m.porDev||''})});
  (db.log||[]).forEach(l=>{if(l.t<a||l.t>=b)return;let k=l.k;if(k==='bloq'&&String(l.txt).startsWith('Tentativa'))k='tent';if(k==='oc'&&String(l.txt).startsWith('Modo emergência'))k='emg';if(!RG_TIPOS[k])k='pl';
    r.push({id:'l'+l.id,t:l.t,k,pid:l.pid,titulo:k==='emg'?'Modo emergência aberto':l.txt,linhas:[k==='emg'?'':l.det],por:k==='emg'?l.det:''})});
  return r.sort((x,y)=>y.t-x.t)}
function rgFiltrados(){const [a,b]=rgPeriodo();const G=perfil().gerir;let r=registros(a,b);const t=ui.rgTipo||'';
  if(t==='__semaval')r=G?r.filter(e=>e.k==='ent_cat'&&avalCatraca(e.cat).st!=='ok'):r;else if(t==='__agenda')r=r.filter(e=>e.agenda);else if(t==='__entradas')r=r.filter(e=>e.k==='ent_port'||e.k==='ent_cat');else if(t==='__saidas')r=r.filter(e=>e.k==='sai_port'||e.k==='sai_cat');else if(t)r=r.filter(e=>e.k===t);
  const q=norm(ui.rgQ||'').trim();if(q){const ws=q.split(/\s+/);r=r.filter(e=>{const h=norm([RG_TIPOS[e.k][0],e.titulo,...e.linhas,e.por,hhmm(e.t),dataBR(e.t)].join(' '));return ws.every(w=>h.includes(w))})}
  return r}
function rgBloco(e){const [lab,i,c]=RG_TIPOS[e.k];const G=perfil().gerir;let av='';
  if(G&&e.k==='ent_cat'){const x=avalCatraca(e.cat);av=x.st==='ok'?`<span class="chip ok">Porteiro registrou antes · ${hhmm(x.t)}${x.por?' · '+esc(primeiro(x.por)):''}</span>`:x.st==='depois'?`<span class="chip warn">Porteiro registrou depois · ${hhmm(x.t)}</span>`:`<span class="chip danger">Sem registro do porteiro</span>`}
  const h0=hoje0(),ls=e.linhas.filter(Boolean);
  return `<li class="rg${e.exc?' rg-exc':''}"><span class="ti ${e.exc?'k-danger':c}">${ic(i)}</span><div class="rg-b">

    ${e.por||e.sim||av?`<span class="rg-m">${e.por?'Registrado por '+esc(e.por):''}${e.sim?' <span class="chip">demonstração</span>':''}${av?' '+av:''}</span>`:''}
  </div></li>`}
function rgTabela(pag){const G=perfil().gerir,h0=hoje0();return `<div class="tbl-wrap"><table class="tbl"><thead><tr><th>Hora</th><th>Tipo</th><th>Pessoa / destino</th><th>Detalhes</th><th>Registrado por</th></tr></thead><tbody>${pag.map(e=>{const [lab]=RG_TIPOS[e.k],ls=e.linhas.filter(Boolean);
  let av='';if(G&&e.k==='ent_cat'){const x=avalCatraca(e.cat);av=x.st==='ok'?'<span class="chip ok">Registrou antes</span>':x.st==='depois'?'<span class="chip warn">Registrou depois</span>':'<span class="chip danger">Sem registro</span>'}
  return `<tr${e.exc?' class="rg-exc-row"':''}><td class="mono">${hhmm(e.t)}${e.t<h0?'<br><span class="muted">'+dataBR(e.t)+'</span>':''}</td><td>${lab}${e.exc?' <span class="chip danger">exceção</span>':''}</td><td>${e.pid&&pessoa(e.pid)?`<button class="link" data-act="pessoa" data-id="${e.pid}">${esc(e.titulo)}</button>`:esc(e.titulo)}</td><td class="muted">${ls.map(esc).join(' · ')}</td><td>${esc(e.por||'')}${e.sim?' <span class="chip">demonstração</span>':''}${av?'<br>'+av:''}</td></tr>`}).join('')}</tbody></table></div>`}
function rgListaHTML(){const r=rgFiltrados(),N=10,pg=Math.max(1,Math.ceil(r.length/N));ui.rgPag=Math.min(Math.max(1,ui.rgPag||1),pg);const i0=(ui.rgPag-1)*N,pag=r.slice(i0,i0+N);

const isoDia=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const nomeCurto=p=>{const w=String(p.nome||'').trim().split(/\s+/).filter(Boolean);return w.length?(w.length>1?w[0]+' '+w[w.length-1]:w[0]):'Pessoa sem nome'};
function ctxDia(dia){const d0=new Date(dia+'T00:00:00');const a=d0.getTime();const b=Math.min(a+86400000,Date.now()+1);const ds=d0.toLocaleDateString('pt-BR',{weekday:'long',day:'2-digit',month:'2-digit',year:'numeric'});
  return {tipo:'dia',dia,titulo:'Relatório do dia',a,b,periodo:ds.charAt(0).toUpperCase()+ds.slice(1),resp:'',obs:'',arquivo:'relatorio-dia-'+dia}}
function ctxPlantao(r){return {tipo:'plantao',titulo:'Relatório do plantão',a:r.inicio,b:r.fim,periodo:`Plantão de ${fmtDH(r.inicio)} a ${fmtDH(r.fim)}`,resp:r.resp||'',obs:r.obs||'',arquivo:'relatorio-plantao-'+isoDia(new Date(r.inicio))+'-'+hhmm(r.inicio).replace(':','h')}}
function dadosRel(c){const vs=db.visitas.filter(v=>v.entrada>=c.a&&v.entrada<c.b).sort((x,y)=>x.entrada-y.entrada);const tipo=t=>vs.filter(v=>(pessoa(v.pid)||{}).tipo===t).length;
  const dentro=db.visitas.filter(v=>v.entrada<c.b&&(!v.saida||v.saida>c.b));
  const kmov=db.movChaves.filter(m=>m.retirada>=c.a&&m.retirada<c.b).sort((x,y)=>x.retirada-y.retirada);
  const kfora=db.movChaves.filter(m=>m.retirada<c.b&&(!m.devolucao||m.devolucao>c.b));
  return {vs,total:vs.length,resp:tipo('responsavel'),vis:tipo('visitante'),prest:tipo('prestador'),buscas:vs.filter(v=>v.motivo==='Buscar aluno').length,exc:vs.filter(v=>v.obs).length,dentro,kmov,kfora,tent:(db.log||[]).filter(l=>l.k==='bloq'&&String(l.txt).startsWith('Tentativa')&&l.t>=c.a&&l.t<c.b)}}
function relTexto(c,nomes){const s=dadosRel(c);
  const L=[`*${c.titulo} · ${db.config.escola}*`,c.periodo,`Gerado em ${fmtDH(Date.now())} por ${quem()}`];
  if(c.resp)L.push(`Vigia responsável: ${c.resp}`);
  L.push('','*Resumo*',`• Entradas: ${s.total}`,`• Responsáveis: ${s.resp} · Visitantes: ${s.vis} · Prestadores: ${s.prest}`,`• Alunos buscados: ${s.buscas}`,`• Ainda na escola: ${s.dentro.length}`,`• Exceções (bloqueados liberados): ${s.exc}`,`• Tentativas de pessoas bloqueadas: ${s.tent.length}`);
  s.tent.forEach(l=>L.push(`   ${hhmm(l.t)} – ${l.det}`));
  if(nomes&&s.total){L.push('','*Entradas*');s.vs.forEach(v=>{const p=pessoa(v.pid);if(p)L.push(`${hhmm(v.entrada)}${v.saida&&v.saida<=c.b?'–'+hhmm(v.saida):' (na escola)'} · ${nomeCurto(p)} · ${TIPOS[p.tipo]} · ${destinoTxt(v)}${v.aluno?' ('+v.aluno+')':''}${v.placa?' · placa '+v.placa:''}${v.obs?' · EXCEÇÃO':''}`)})}
  if(nomes&&s.dentro.length){L.push('','*Ainda na escola*');s.dentro.forEach(v=>{const p=pessoa(v.pid);if(p)L.push(`• ${nomeCurto(p)} (desde ${hhmm(v.entrada)})`)})}
  L.push('','*Chaves*',`• Retiradas: ${s.kmov.length}`,`• Ainda com funcionários: ${s.kfora.length}`);
  s.kfora.forEach(m=>L.push(`• ${kNome(m)} com ${nomeCurto({nome:fNome(m)})} desde ${hhmm(m.retirada)}`));
  const ocs=ocorrencias(c.a,c.b);L.push('','*Ocorrências*');ocs.forEach(l=>L.push(`${hhmm(l.t)} – ${l.det}`));
  if(c.obs)L.push('Observação final: '+c.obs);if(!ocs.length&&!c.obs)L.push('Sem ocorrências registradas.');
  return L.join('\n');
}

(function(){const R=document.documentElement;let base=0,kb0=false;
  const campo=el=>!!el&&(el.tagName==='TEXTAREA'||(el.tagName==='INPUT'&&!/^(checkbox|radio|button|submit|file|range|color|date|time)$/i.test(el.type))||el.isContentEditable);
  function upd(){const vv=window.visualViewport,h=vv?vv.height:window.innerHeight,t=vv?vv.offsetTop:0;
    R.style.setProperty('--vvh',Math.round(h)+'px');R.style.setProperty('--vvt',Math.round(t)+'px');
    const foc=campo(document.activeElement);if(!foc||!base)base=Math.max(h,foc?0:h);
    const kb=foc&&h<base-120;if(kb!==kb0){kb0=kb;R.dataset.kb=kb?'1':'';const b=document.getElementById('chatMsgs');if(b)b.scrollTop=b.scrollHeight}
    R.dataset.chatfull=document.querySelector('.chat-conv.full')?'1':''}
  window.__vvUpd=upd;
  if(window.visualViewport){visualViewport.addEventListener('resize',upd);visualViewport.addEventListener('scroll',upd)}
  window.addEventListener('resize',upd);window.addEventListener('orientationchange',()=>{base=0;setTimeout(upd,300)});
  document.addEventListener('focusin',e=>{setTimeout(upd,60);setTimeout(upd,400);const el=e.target;if(campo(el)&&!el.closest('.chat-conv.full'))setTimeout(()=>{if(document.activeElement===el&&R.dataset.kb==='1')el.scrollIntoView({block:'center',behavior:'smooth'})},450)});
  document.addEventListener('focusout',()=>setTimeout(upd,120));
  new MutationObserver(()=>{const f=document.querySelector('.chat-conv.full')?'1':'';if(R.dataset.chatfull!==f)R.dataset.chatfull=f}).observe(document.getElementById('app'),{childList:true});
  upd()})();

/* ===== SONS: clique e notificação (gerados pelo próprio navegador, sem arquivos) ===== */
const SOM={ctx:null,cfg:{clique:true,aviso:true}};
try{const c=JSON.parse(localStorage.getItem('portaria-som')||'null');if(c)SOM.cfg=Object.assign(SOM.cfg,c)}catch(e){}

function somCtx(){try{if(!SOM.ctx){const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return null;SOM.ctx=new AC()}if(SOM.ctx.state==='suspended')SOM.ctx.resume();return SOM.ctx}catch(e){return null}}
function somNota(f,ini,dur,vol,tipo){const c=somCtx();if(!c)return;const t=c.currentTime+ini,o=c.createOscillator(),g=c.createGain();o.type=tipo||'sine';o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+0.008);g.gain.exponentialRampToValueAtTime(0.0001,t+dur);o.connect(g);g.connect(c.destination);o.start(t);o.stop(t+dur+0.02)}
function somClique(){const n=Date.now();if(!SOM.cfg.clique||n-(SOM.tc||0)<120)return;SOM.tc=n;somNota(1500,0,0.045,0.05,'sine')}

const GCAT={verba:['Verba do mês','chart'],economia:['Economia','check'],compras:['Compras','file'],estoque:['Estoque','list'],infra:['Infraestrutura','alert'],venc:['Vencimentos','cal'],merenda:['Merenda','users'],portaria:['Portaria','door'],nota:['Anotação','file']};

const G_=()=>gPatch();
const brl=v=>(Number(v)||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});
const mesKey=t=>{const d=new Date(t);return d.getFullYear()+'-'+pad(d.getMonth()+1)};

function gMes(){const m=mesKey(Date.now()),g=G_();const gastos=g.gastos.filter(x=>mesKey(x.t)===m);const verba=g.setores.reduce((a,x)=>a+(+x.valor||0),0),gasto=gastos.reduce((a,x)=>a+(+x.valor||0),0);
  const d=new Date(),dia=d.getDate(),nd=new Date(d.getFullYear(),d.getMonth()+1,0).getDate();return {m,gastos,verba,gasto,saldo:verba-gasto,prev:dia?gasto/dia*nd:gasto,porSetor:g.setores.map(st=>({...st,gasto:gastos.filter(x=>x.setor===st.nome).reduce((a,x)=>a+(+x.valor||0),0)}))}}
const cotEsc=c=>(c.cotacoes||[])[c.esc]||{valor:0,forn:''};
function econCompra(c){const vs=(c.cotacoes||[]).map(x=>+x.valor||0).filter(v=>v>0);if(vs.length<2)return 0;return Math.max(...vs)-(+cotEsc(c).valor||0)}
function gEconomia(){const g=G_(),m=mesKey(Date.now()),a=String(new Date().getFullYear());const cs=g.compras.filter(c=>c.status!=='aprovar');
  const mes=cs.filter(c=>mesKey(c.criado)===m),ano=cs.filter(c=>mesKey(c.criado).startsWith(a));return {mes:mes.reduce((s,c)=>s+econCompra(c),0),ano:ano.reduce((s,c)=>s+econCompra(c),0),lista:mes.filter(c=>econCompra(c)>0).sort((x,y)=>econCompra(y)-econCompra(x))}}
const estDias=e=>(+e.consumo>0)?Math.floor((+e.qtd||0)/(+e.consumo)):Infinity;
const estCritico=e=>(+e.qtd||0)<=(+e.min||0)||estDias(e)<=7;

  if(c.tipo==='merenda'){const ms=g.merenda.slice().sort((a,b)=>b.dia.localeCompare(a.dia)).slice(0,5),h=ms.find(x=>x.dia===hojeISO());const tot=ms.reduce((a,x)=>a+(+x.refeicoes||0),0),cus=ms.reduce((a,x)=>a+(+x.custo||0),0),sob=ms.reduce((a,x)=>a+(+x.sobra||0),0);
    return `<div><div class="gc-big">${h?h.refeicoes:'—'}</div><div class="gc-sub">refeições hoje · média ${ms.length?Math.round(tot/ms.length):0} por dia</div></div>
      <ul class="gc-l"><li><span>Custo por refeição</span><span>${tot?brl(cus/tot):'—'}</span></li><li><span>Sobras (últimos ${ms.length} dias)</span><span>${sob.toFixed(1).replace('.',',')} kg</span></li></ul>`}
  if(c.tipo==='portaria'){const dentro=db.visitas.filter(v=>!v.saida).length,hoje=db.visitas.filter(v=>v.entrada>=hoje0()).length,oc=ocorrencias(hoje0(),Date.now()+1).length,kf=kFora().length;

function nvMerge(rem,loc){
